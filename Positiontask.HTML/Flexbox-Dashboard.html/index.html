<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechnoIT Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">TechnoIT</div>

        <ul class="menu">
            <li>Home</li>
            <li>Services</li>
            <li>Portfolio</li>
            <li>Testimonials</li>
            <li>Team</li>

            <li class="dropdown">
                Menu
                <ul class="dropdown-menu">
                    <li>About</li>
                    <li>Projects</li>
                    <li>Pricing</li>
                    <li>Contact</li>
                </ul>
            </li>

            <li>News</li>
        </ul>

        <div class="right-nav">
            <i class="fa-solid fa-moon"></i>
            <button class="quote-btn">Get Quotes</button>
        </div>

    </header>


    <section class="hero">

        <div class="left">
            <img src="robot.PNG.png" alt="Robot">
        </div>

        <div class="right">

            <h1>
                Delivering Superior Services
                <span>IT Solutions.</span>
            </h1>

            <p>
                Providing innovative technology solutions to help
                       businesses grow faster and smarter.
            </p>

            <div class="social">
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-linkedin"></i>
                <i class="fa-brands fa-instagram"></i>
            </div>

            <div class="buttons">
                <button class="btn1">Get Quotes</button>
                <button class="btn2">Get Started</button>
            </div>

        </div>

    </section>

</body>
</html>
