<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-arrow">
        <div class="arrow-line"></div>
        <h2>grid-template-column (Width)</h2>
    </div>

    <div class="main-layout">

        <div class="vertical-wrapper">
            <div class="vertical-arrow"></div>
            <div class="vertical-text">
                grid-template-row (Height)
            </div>
        </div>

        <div>

            <div class="container">

                <div class="box green left"></div>

                <div class="box green top"></div>
                <div class="box red top-right"></div>

                <div class="box yellow middle-left"></div>
                <div class="box red middle-right"></div>

                <div class="box red bottom-left"></div>
                <div class="box yellow bottom-right"></div>

                <div class="box green right"></div>

            </div>

            <div class="gap-wrapper">
    <div class="gap-arrow"></div>
    <h3>gap: 10px</h3>
</div>

        </div>

    </div>

    <h1 class="title">CSS GRID</h1>

</body>
</html>
