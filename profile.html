<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>
        body{
            background-color:#e6e6e6;
            font-family:Arial, sans-serif;
        }

        .card{
            width:300px;
            background:white;
            margin:50px auto;
            padding:30px;
            text-align:center;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        .profile-img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:3px solid #ccc;
        }

        h1{
            margin-top:20px;
            font-size:28px;
        }

        h2{
            color:gray;
            font-weight:normal;
            margin-top:10px;
        }

        p{
            font-size:18px;
            margin-top:25px;
            line-height:1.5;
        }

        button{
            width:90%;
            padding:15px;
            margin-top:40px;
            background:#1877f2;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="profile.jpg" alt="Profile Picture" class="profile-img">

        <h1>Sneha Gowda</h1>

        <h2>Web Developer</h2>

        <p>
            A simple, clean profile card
            design using the CSS box model.
        </p>

        <button>Contact</button>

    </div>

</body>
</html>
